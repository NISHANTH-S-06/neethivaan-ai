name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (heavy ML deps skipped; tests mock them)
        run: |
          grep -v -E 'sentence-transformers|weasyprint|chromadb|^together|huggingface' backend/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pytest aiosqlite
      - name: Tests
        run: python -m pytest backend/tests -q -p no:cacheprovider -W ignore
        env:
          SECRET_KEY: ci-test-secret
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
