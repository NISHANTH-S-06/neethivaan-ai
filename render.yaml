services:
  - type: web
    name: neethivaan-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon connection string (set in the Render dashboard)
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your Vercel URL, e.g. https://neethivaan.vercel.app
