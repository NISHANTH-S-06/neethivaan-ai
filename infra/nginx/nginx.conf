events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    server {
        listen 80;
        server_name neethivaan.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name neethivaan.in;

        ssl_certificate /etc/letsencrypt/live/neethivaan.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/neethivaan.in/privkey.pem;
        
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";

        location /api/auth/ {
            limit_req zone=auth burst=5;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location /api/ {
            limit_req zone=general burst=20;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location / {
            limit_req zone=general burst=50;
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
        }
    }
}
